<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div style="display: flex; flex-direction: row; align-items: flex-start">
      <header style="text-align: center; font-size: 500%">A.R.T. Dashboard</header>
    </div>
    
    <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; margin-top: 40px">
      
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 15px">
        <header style="text-align: center; font-size: 200%">Bookmarked Events</header>
      </div>
      
      <div style="display: flex; flex-direction: column; align-items: center; gap: 15px">
        <header style="text-align: center; font-size: 200%">Saved Resources</header>
      </div>
      
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 15px">
        <input type="text" name="search_field" placeholder="Search" style="width: 300px; height: 40px; ">
        <div style="background-color: #f0f0f0; border: 2px solid #333; padding: 20px; border-radius: 8px; width: 250px; height: 600px;">
          Search Results
        </div>
      </div>
      
    </div>
  </body>
</html>
